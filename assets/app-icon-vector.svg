<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Glowing Garment Gradient -->
    <linearGradient id="garmentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Vision Laser / Scanner Gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset="25%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="75%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>

    <!-- Collar / Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Tag Gradient -->
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="laserGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#4f46e5" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="1200" fill="url(#bg)"/>

  <!-- Subtle Radial Ambient Light Behind Apparel -->
  <circle cx="600" cy="620" r="420" fill="#4f46e5" opacity="0.18" filter="blur(60px)"/>
  <circle cx="600" cy="600" r="280" fill="#06b6d4" opacity="0.12" filter="blur(40px)"/>

  <!-- Subtle Circular Scanning Grid Ring -->
  <circle cx="600" cy="620" r="460" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.15" fill="none" stroke-dasharray="8 12"/>
  <circle cx="600" cy="620" r="380" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.1" fill="none"/>

  <!-- Camera Optical Viewfinder Brackets (4 Corners) -->
  <g stroke="#38bdf8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.75">
    <!-- Top-Left -->
    <path d="M 230 350 L 230 250 L 330 250"/>
    <!-- Top-Right -->
    <path d="M 970 350 L 970 250 L 870 250"/>
    <!-- Bottom-Left -->
    <path d="M 230 890 L 230 990 L 330 990"/>
    <!-- Bottom-Right -->
    <path d="M 970 890 L 970 990 L 870 990"/>
  </g>

  <!-- Main Apparel Garment (Tops / Shirt Silhouette) -->
  <g filter="url(#softGlow)">
    <!-- T-Shirt Body & Sleeves (Solid iconic path) -->
    <path d="
      M 480 320
      C 520 370 680 370 720 320
      L 890 410
      C 920 425 930 460 915 490
      L 835 630
      C 820 655 790 665 765 650
      L 730 630
      L 745 920
      C 745 945 725 965 700 965
      L 500 965
      C 475 965 455 945 455 920
      L 470 630
      L 435 650
      C 410 665 380 655 365 630
      L 285 490
      C 270 460 280 425 310 410
      Z
    " fill="url(#garmentGrad)"/>

    <!-- Inside Garment Fabric Texture / Collar Accent -->
    <path d="
      M 480 320
      C 540 380 660 380 720 320
      C 670 345 530 345 480 320
      Z
    " fill="url(#accentGrad)" opacity="0.9"/>
  </g>

  <!-- Left Sleeve Hem Detail Line -->
  <path d="M 295 470 L 385 520" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.4" stroke-linecap="round"/>
  <!-- Right Sleeve Hem Detail Line -->
  <path d="M 905 470 L 815 520" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.4" stroke-linecap="round"/>

  <!-- Horizontal AI Vision Scanning Beam across Chest -->
  <g filter="url(#laserGlow)">
    <!-- Scanning Plane (Glow gradient rectangle) -->
    <rect x="200" y="600" width="800" height="40" fill="url(#laserGrad)" opacity="0.35"/>
    <!-- Laser Beam Center Line -->
    <line x1="220" y1="620" x2="980" y2="620" stroke="#ffffff" stroke-width="4" opacity="0.95"/>
    <line x1="300" y1="620" x2="900" y2="620" stroke="#38bdf8" stroke-width="8" opacity="0.8"/>
  </g>

  <!-- AI Neural Vision Eye / Sparkle in Center of Shirt -->
  <!-- Target Reticle -->
  <circle cx="600" cy="620" r="65" fill="#0f172a" stroke="#38bdf8" stroke-width="6"/>
  <circle cx="600" cy="620" r="50" fill="none" stroke="#6366f1" stroke-width="3" stroke-dasharray="4 6"/>

  <!-- Glowing 4-Point AI Star inside the Reticle -->
  <path d="
    M 600 575
    C 600 605 615 620 645 620
    C 615 620 600 635 600 665
    C 600 635 585 620 555 620
    C 585 620 600 605 600 575
    Z
  " fill="#38bdf8"/>
  <circle cx="600" cy="620" r="6" fill="#ffffff"/>

  <!-- Smart Taxonomy Category Tag (Floating on Upper Right Collar) -->
  <g transform="translate(690, 410) rotate(15)" filter="url(#softGlow)">
    <!-- Tag String -->
    <path d="M 0 0 C -15 -30 -30 -40 -45 -50" stroke="#ffffff" stroke-width="3" stroke-opacity="0.6" fill="none"/>
    <!-- Price / Taxonomy Tag Body -->
    <path d="
      M 0 0
      L 110 0
      L 150 40
      L 110 80
      L 0 80
      Z
    " fill="url(#tagGrad)"/>
    <!-- Tag Eyelet -->
    <circle cx="30" cy="40" r="10" fill="#0a0e1a"/>
    <!-- Tag AI Symbol (Small Sparkle) -->
    <path d="
      M 95 25
      C 95 35 100 40 110 40
      C 100 40 95 45 95 55
      C 95 45 90 40 80 40
      C 90 40 95 35 95 25
      Z
    " fill="#ffffff"/>
  </g>

  <!-- Metadata Data Pill (Neckline / Sleeve Attribute Badge at Bottom Center) -->
  <g transform="translate(420, 830)">
    <rect width="360" height="60" rx="30" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.6"/>
    <!-- Green Status Pulse -->
    <circle cx="40" cy="30" r="6" fill="#10b981"/>
    <text x="65" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="2">
      CREWNECK &bull; SOLID
    </text>
  </g>

</svg>
