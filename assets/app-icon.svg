<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Scanning grid aura -->
  <circle cx="256" cy="256" r="180" stroke="white" stroke-opacity="0.08" stroke-width="2" fill="none"/>
  <circle cx="256" cy="256" r="130" stroke="white" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="6 8" fill="none"/>

  <!-- Central Camera Aperture & Apparel Tag Symbol -->
  <g filter="url(#shadow)">
    <!-- Outer Vision Corner Brackets -->
    <path d="M 130 190 L 130 140 L 180 140" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round"/>
    <path d="M 382 190 L 382 140 L 332 140" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round"/>
    <path d="M 130 322 L 130 372 L 180 372" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round"/>
    <path d="M 382 322 L 382 372 L 332 372" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round"/>

    <!-- Fashion Hanger / Garment Silhouette -->
    <path d="M 256 180 C 235 180 235 205 256 215 L 180 270 C 165 280 175 295 190 295 L 322 295 C 337 295 347 280 332 270 Z" 
          fill="none" stroke="#ffffff" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Central AI Neural Sparkle -->
    <path d="M 256 240 L 262 254 L 276 260 L 262 266 L 256 280 L 250 266 L 236 260 L 250 254 Z" fill="#38bdf8"/>
    
    <!-- Tag Dot / Eye Indicator -->
    <circle cx="256" cy="180" r="12" fill="#38bdf8"/>
  </g>
</svg>
